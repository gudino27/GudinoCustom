server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;
    # llms.txt, robots.txt and the pages are UTF-8 (Spanish accents)
    charset utf-8;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    
    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"OK","service":"frontend","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }
    
    # Public pages are prerendered to <page>/index.html and es/<page>/index.html
    # (scripts/prerender.js). $uri/index.html serves them for /about without the
    # 301 to /about/ that a $uri/ directory match would send. Everything else
    # (admin, token links, unknown URLs) gets the noindex app shell; index.html
    # is only a last resort if a build was made without the prerender step.
    location / {
        try_files $uri $uri/index.html /app-shell.html /index.html;
    }
    
    # API proxy to backend-new during deployment
    location /api {
        proxy_pass http://backend-new:3001;
        # a design quote (PDF + design with its plan images) can be over
        # nginx's 1 MB default; the backend allows 10 MB + 15 MB
        client_max_body_size 20M;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}