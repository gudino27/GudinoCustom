# Private client design links: the request line holds the link's token and the
# default "main" format logs the client IP, so these requests are not logged.
# Case-insensitive because Express routes ignore case.
map $request_uri $gv_log {
    ~*^/+(view|api/+design-links)/ 0;
    default 1;
}

server {
    listen 80;
    server_name gudinocustom.com www.gudinocustom.com localhost;
    access_log /var/log/nginx/access.log main if=$gv_log;
    
    # SEO files - route to backend
    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    location /api {
        proxy_pass http://backend:3001/api;
        # a design quote (PDF + design with its plan images) can be over
        # nginx's 1 MB default; the backend allows 10 MB + 15 MB
        client_max_body_size 20M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }    

    # Design link paths (same match as the map above): proxied like /api and /
    # below, but with no error log, because a 502 (say during a deploy) would
    # write the token in the request line. A regex location takes no URI in
    # proxy_pass, so the request URI goes to the backend as sent.
    location ~* ^/+api/+design-links/ {
        error_log /dev/null crit;
        proxy_pass http://backend:3001;
        client_max_body_size 20M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location ~* ^/+view/ {
        error_log /dev/null crit;
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 3001;
    server_name api.gudinocustom.com localhost;
    access_log /var/log/nginx/access.log main if=$gv_log;

    client_max_body_size 20M;

    # Design link paths: no error log (see the first server block)
    location ~* ^/+(view|api/+design-links)/ {
        error_log /dev/null crit;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # CORS is handled by Node.js - don't add headers here to avoid duplicates
    }
}
